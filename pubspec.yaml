publish_to: "none"
version: 1.0.0+10

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  uuid: ^4.4.2
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/field_time/
    - assets/data/

name: Field Time CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/test04-bottom-nav-reset
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Test 04 UI refresh patch
        if: github.event_name == 'pull_request'
        run: python3 tooling/test04_ui_refresh_patch.py

      - name: Format changed Dart files
        if: github.event_name == 'pull_request'
        run: dart format lib/src/presentation/screens/time_records_screen.dart lib/src/presentation/screens/timesheet_screen.dart lib/src/platform

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "/field-time/"

      - name: Commit validated Test 04 UI changes
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            echo "No validated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/presentation/screens/time_records_screen.dart lib/src/presentation/screens/timesheet_screen.dart lib/src/platform
          git commit -m "feat: interactive status cards and in-app refresh controls"
          git push origin HEAD:fix/test04-bottom-nav-reset

name: Test 04 iPhone PDF Share

on:
  push:
    branches:
      - test04-iphone-pdf-share
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test04-iphone-pdf-share
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply iPhone PDF delivery patch
        run: python3 tooling/test04_iphone_pdf_share.py
      - name: Format
        run: dart format lib/src/presentation/screens/timesheet_screen.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build web
        run: flutter build web --release --base-href "/field-time/"
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/presentation/screens/timesheet_screen.dart
          git commit -m "fix: deliver generated timesheet PDF through share or save flow"
          git pull --rebase origin test04-iphone-pdf-share
          git push origin HEAD:test04-iphone-pdf-share

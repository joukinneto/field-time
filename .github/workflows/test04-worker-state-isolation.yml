name: Test 04 Worker State Isolation

on:
  push:
    branches:
      - test04-worker-state-isolation

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test04-worker-state-isolation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply worker state isolation patch
        run: python3 tooling/test04_worker_state_isolation_patch.py
      - name: Format
        run: dart format lib/src/domain/field_time_models.dart lib/src/application/field_time_application_service.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build web
        run: flutter build web --release --base-href "/field-time/"
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/domain/field_time_models.dart lib/src/application/field_time_application_service.dart
          git commit -m "fix: isolate active work state by collaborator"
          git push origin HEAD:test04-worker-state-isolation

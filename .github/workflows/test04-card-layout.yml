name: Test 04 Card Layout

on:
  push:
    branches:
      - test04-homogeneous-interactive-cards
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test04-homogeneous-interactive-cards
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply card layout patch
        run: python3 tooling/test04_card_layout_patch.py
      - name: Format
        run: dart format lib/src/supervisor_center/supervisor_center_screen.dart lib/src/presentation/screens/timesheet_screen.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build web
        run: flutter build web --release --base-href "/field-time/"
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/supervisor_center/supervisor_center_screen.dart lib/src/presentation/screens/timesheet_screen.dart
          git commit -m "fix: align and standardize interactive management cards"
          git push origin HEAD:test04-homogeneous-interactive-cards

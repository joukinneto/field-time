name: Test 04 Keep Settings After Simulation

on:
  push:
    branches:
      - test04-keep-settings-after-simulation

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test04-keep-settings-after-simulation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply settings persistence patch
        run: python3 tooling/test04_keep_settings_after_simulation_patch.py
      - name: Format
        run: dart format lib/src/presentation/screens/time_records_screen.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build web
        run: flutter build web --release --base-href "/field-time/"
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/presentation/screens/time_records_screen.dart
          git commit -m "fix: keep settings open after simulation change"
          git pull --rebase origin test04-keep-settings-after-simulation
          git push origin HEAD:test04-keep-settings-after-simulation

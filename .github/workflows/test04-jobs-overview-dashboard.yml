name: Test 04 Jobs Overview Dashboard

on:
  push:
    branches:
      - feat-jobs-overview-dashboard

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-jobs-overview-dashboard
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply patch
        run: python3 tooling/test04_jobs_overview_dashboard_patch.py
      - name: Format
        run: dart format lib/src/supervisor_center/supervisor_center_screen.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build web
        run: flutter build web --release --base-href "/field-time/"
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/supervisor_center/supervisor_center_screen.dart
          git commit -m "feat: add jobs overview hours dashboard"
          git pull --rebase origin feat-jobs-overview-dashboard
          git push origin HEAD:feat-jobs-overview-dashboard

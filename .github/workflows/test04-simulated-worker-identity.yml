name: Test 04 Simulated Worker Identity

on:
  push:
    branches:
      - test04-simulated-worker-identity
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test04-simulated-worker-identity
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply simulated worker identity patch
        run: python3 tooling/test04_simulated_worker_identity_patch.py
      - name: Format
        run: dart format lib/src/application/field_time_controller.dart lib/src/presentation/screens/time_records_screen.dart lib/src/supervisor_center/field_time_supervisor_sync.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build web
        run: flutter build web --release --base-href "/field-time/"
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/application/field_time_controller.dart lib/src/presentation/screens/time_records_screen.dart lib/src/supervisor_center/field_time_supervisor_sync.dart
          git commit -m "fix: bind simulated collaborator to Field Time identity"
          git push origin HEAD:test04-simulated-worker-identity

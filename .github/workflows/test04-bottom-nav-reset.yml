name: Test 04 Bottom Navigation Reset

on:
  push:
    branches:
      - fix/test04-bottom-nav-reset
    paths:
      - tooling/test04_bottom_nav_reset_patch.py
      - .github/workflows/test04-bottom-nav-reset.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/test04-bottom-nav-reset
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply navigation reset patch
        run: python3 tooling/test04_bottom_nav_reset_patch.py

      - name: Format
        run: dart format lib/src/presentation/screens/time_records_screen.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "/field-time/"

      - name: Commit validated change
        run: |
          if git diff --quiet; then
            echo "No validated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/presentation/screens/time_records_screen.dart
          git commit -m "fix: reset nested view from bottom navigation"
          git pull --rebase origin fix/test04-bottom-nav-reset
          git push origin HEAD:fix/test04-bottom-nav-reset

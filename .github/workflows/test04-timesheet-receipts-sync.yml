name: Test 04 Timesheet Receipts Sync

on:
  push:
    branches:
      - feat-test04-timesheet-receipts-sync

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-test04-timesheet-receipts-sync
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply patch
        run: python3 tooling/test04_timesheet_receipts_sync_patch.py
      - name: Format
        run: dart format lib/src/domain/field_time_models.dart lib/src/application/field_time_application_service.dart lib/src/presentation/screens/timesheet_screen.dart lib/src/presentation/screens/time_records_screen.dart lib/shared/widgets/jkdd_app_bar.dart lib/src/timesheet/timesheet_excel_service.dart lib/src/platform/file_download.dart lib/src/platform/file_download_stub.dart lib/src/platform/file_download_web.dart
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git commit -m "feat: improve timesheet exports receipts and sync status"
          git pull --rebase origin feat-test04-timesheet-receipts-sync
          git push origin HEAD:feat-test04-timesheet-receipts-sync
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build web
        run: flutter build web --release --base-href "/field-time/"

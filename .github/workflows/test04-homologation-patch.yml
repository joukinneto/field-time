name: Test 04 Homologation Patch

on:
  push:
    branches:
      - fix/test04-homologation
    paths:
      - tooling/test04_homologation_patch.py
      - .github/workflows/test04-homologation-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout homologation branch
        uses: actions/checkout@v4
        with:
          ref: fix/test04-homologation
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Test 04 corrections
        run: python3 tooling/test04_homologation_patch.py

      - name: Format changed Dart files
        run: dart format lib/src/application/field_time_controller.dart lib/src/presentation/screens/time_records_screen.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Web
        run: flutter build web --release --base-href "/field-time/"

      - name: Commit validated corrections
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/application/field_time_controller.dart lib/src/presentation/screens/time_records_screen.dart
          git commit -m "fix: complete Test 04 collaborator and receipt homologation"
          git push origin HEAD:fix/test04-homologation

name: Test 04 Job Hours Patch

on:
  push:
    branches:
      - test04-job-hours-director
    paths:
      - tooling/test04_job_hours_patch.py
      - .github/workflows/test04-job-hours-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test04-job-hours-director
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply job-hours patch
        run: python3 tooling/test04_job_hours_patch.py

      - name: Format
        run: dart format lib/src/supervisor_center/supervisor_center_screen.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "/field-time/"

      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/supervisor_center/supervisor_center_screen.dart
          git commit -m "feat: show job hours totals for supervisor and director"
          git push origin HEAD:test04-job-hours-director

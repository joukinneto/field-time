name: Test 04 Approval Rules and Job Search

on:
  push:
    branches:
      - test04-approval-rules-job-search

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test04-approval-rules-job-search
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply patch
        run: python3 tooling/test04_approval_rules_job_search_patch.py
      - name: Format
        run: dart format lib/src/presentation/screens/time_records_screen.dart lib/src/presentation/screens/timesheet_screen.dart lib/src/supervisor_center/supervisor_center_controller.dart lib/src/supervisor_center/supervisor_center_screen.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build web
        run: flutter build web --release --base-href "/field-time/"
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/presentation/screens/time_records_screen.dart lib/src/presentation/screens/timesheet_screen.dart lib/src/supervisor_center/supervisor_center_controller.dart lib/src/supervisor_center/supervisor_center_screen.dart
          git commit -m "feat: refine approval rules and searchable job picker"
          git pull --rebase origin test04-approval-rules-job-search
          git push origin HEAD:test04-approval-rules-job-search

name: Test 04 Director Simulation

on:
  push:
    branches:
      - test04-director-simulation
    paths:
      - tooling/test04_director_simulation_patch.py
      - .github/workflows/test04-director-simulation.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test04-director-simulation
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply director simulation patch
        run: python3 tooling/test04_director_simulation_patch.py

      - name: Format changed Dart files
        run: dart format lib/src/supervisor_center/supervisor_center_models.dart lib/src/supervisor_center/supervisor_center_controller.dart lib/src/presentation/screens/time_records_screen.dart lib/src/supervisor_center/supervisor_center_screen.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "/field-time/"

      - name: Commit validated simulation changes
        run: |
          if git diff --quiet; then
            echo "No validated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/supervisor_center/supervisor_center_models.dart lib/src/supervisor_center/supervisor_center_controller.dart lib/src/presentation/screens/time_records_screen.dart lib/src/supervisor_center/supervisor_center_screen.dart
          git commit -m "feat: add director master-login profile simulation"
          git push origin HEAD:test04-director-simulation
